# Typecheck, lint and unit test on every push/PR. No service containers: nothing here talks to a
# database or Redis (that's matinee-server's CI). No secret scan: this repo holds no secrets
# (.env.example lists only the public EXPO_PUBLIC_API_URL); RULES.md F14's full scan runs once,
# near submission, across all repos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
